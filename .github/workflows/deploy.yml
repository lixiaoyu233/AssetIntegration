name: Deploy 资产整合 to GitHub Pages

# 推送到 main 分支时自动构建并发布到 GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # pnpm 版本由 package.json 的 packageManager 字段决定
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      # Node 必须 >= 22.13：pnpm 11 会用到 node:sqlite 内置模块
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm run typecheck

      - name: Unit tests
        run: pnpm test
        env:
          # CI 里不跑联网接口用例，避免第三方接口抖动导致部署失败
          ACW_SKIP_API: '1'

      - name: Build
        run: pnpm run build
        env:
          NODE_ENV: production

      - name: Add .nojekyll
        run: touch dist/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
