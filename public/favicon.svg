<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="aiBars" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="0.55" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <radialGradient id="aiGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 底板：深墨蓝（1.0 为纯黑），仅暗色主题下的品牌底色 -->
  <rect width="64" height="64" rx="14" fill="#070b14"/>

  <!-- 柔光：给层叠柱一层体积感 -->
  <circle cx="32" cy="30" r="26" fill="url(#aiGlow)"/>

  <!-- 聚合底盘：散落资产收拢到同一视图 -->
  <rect x="15" y="41.5" width="34" height="5.5" rx="2.75" fill="#ffffff" opacity="0.07"/>

  <!-- 三根层叠上升柱（柱间距 > 圆角，1px 也切得开） -->
  <rect x="15" y="36" width="9" height="12" rx="4" fill="url(#aiBars)"/>
  <rect x="27.5" y="28" width="9" height="20" rx="4" fill="url(#aiBars)"/>
  <rect x="40" y="20" width="9" height="28" rx="4" fill="url(#aiBars)"/>

  <!-- 金色顶点：唯一保留的品牌金 = 汇总出来的那个数 -->
  <circle cx="44.5" cy="14" r="4.2" fill="#f0b90b"/>
</svg>
